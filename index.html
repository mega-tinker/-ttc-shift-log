<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#c8102e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TTC Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>TTC Shift Log</title>
</head>
<body>
<header class="topbar">
  <h1>TTC Shift Log</h1>
  <p>Offline personal work record</p>
</header>

<main>
  <nav class="tabs">
    <button class="tab active" data-tab="new">New Shift</button>
    <button class="tab" data-tab="history">History</button>
    <button class="tab" data-tab="summary">Summary</button>
    <button class="tab" data-tab="backup">Backup</button>
  </nav>

  <section id="new" class="panel active">
    <form id="shiftForm">
      <div class="grid">
        <label>Date<input id="date" type="date" required></label>
        <label>Route(s)<input id="routes" type="text" placeholder="54 or 11 / 100" required></label>
        <label>Crew<input id="crew" type="text" inputmode="numeric" placeholder="1" required></label>
        <label>Run<input id="run" type="text" inputmode="numeric" placeholder="54001" required></label>
        <label>Bus<input id="bus" type="text" inputmode="numeric" placeholder="8838" required></label>
        <label>Start<input id="start" type="time" required></label>
        <label>Finish<input id="finish" type="time" required></label>
        <label>Paid<input id="paid" type="text" inputmode="numeric" placeholder="8:16"></label>
        <label>OT<input id="ot" type="text" inputmode="numeric" placeholder="0:16"></label>
        <label>Side Camera
          <select id="camera">
            <option>Unknown</option><option>Yes</option><option>No</option>
          </select>
        </label>
        <label>Incident
          <select id="incident">
            <option>None</option><option>Passenger</option><option>Collision</option>
            <option>Mirror</option><option>Bus Defect</option><option>Road Closure</option>
            <option>Police / EMS</option><option>Other</option>
          </select>
        </label>
      </div>
      <label class="full">Notes<textarea id="notes" rows="5" placeholder="Anything useful you may want to remember..."></textarea></label>
      <div class="actions">
        <button class="primary" type="submit">Save Shift</button>
        <button class="secondary" type="button" id="clearForm">Clear</button>
      </div>
      <p id="saveMessage" class="message"></p>
    </form>
  </section>

  <section id="history" class="panel">
    <input id="search" type="search" placeholder="Search route, crew, run, bus, date, notes...">
    <div id="historyList" class="cards"></div>
  </section>

  <section id="summary" class="panel">
    <div class="summary-grid">
      <div class="stat"><span>Total Shifts</span><strong id="sumShifts">0</strong></div>
      <div class="stat"><span>Total Paid</span><strong id="sumPaid">0:00</strong></div>
      <div class="stat"><span>Total OT</span><strong id="sumOT">0:00</strong></div>
      <div class="stat"><span>Incidents</span><strong id="sumIncidents">0</strong></div>
      <div class="stat"><span>Routes</span><strong id="sumRoutes">0</strong></div>
      <div class="stat"><span>Buses</span><strong id="sumBuses">0</strong></div>
    </div>
    <div class="toplists">
      <div><h3>Most Used Routes</h3><div id="topRoutes"></div></div>
      <div><h3>Most Driven Buses</h3><div id="topBuses"></div></div>
    </div>
  </section>

  <section id="backup" class="panel">
    <div class="backup-box">
      <h2>Backup & Export</h2>
      <p>Your records are stored on this device. Export backups regularly.</p>
      <button id="exportCsv" class="primary">Export CSV</button>
      <button id="exportJson" class="secondary">Backup JSON</button>
      <label class="full">Restore JSON Backup<input id="importJson" type="file" accept=".json,application/json"></label>
      <button id="deleteAll" class="danger">Delete All Records</button>
    </div>
  </section>
</main>

<template id="cardTemplate">
  <article class="record-card">
    <div class="card-head">
      <div><strong class="card-date"></strong><span class="card-route"></span></div>
      <button class="edit-btn">Edit</button>
    </div>
    <div class="card-grid"></div>
    <div class="card-notes"></div>
    <button class="delete-btn">Delete</button>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
